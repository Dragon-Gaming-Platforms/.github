name: Deploy Thumby Color Editor to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for headless emulator testing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (if any)
        run: |
          pip install --quiet --upgrade pip

      - name: Build Thumby Color Editor Game
        run: |
          # The 'game' is the editor itself in thumby_color_editor/ (repo root)
          # We copy it to the gh-pages branch root
          mkdir -p ./gh-pages-build
          cp -r thumby_color_editor/* ./gh-pages-build/
          echo "Built editor for Thumby Color (128x128) and GitHub Pages"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-build
          publish_branch: gh-pages
          force_orphan: true
          # Deploys the Thumby Color Editor 'game' to GitHub Pages
          # on every push to main (and via workflow_dispatch)
